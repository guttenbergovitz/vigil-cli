version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  LDFLAGS: -ldflags "-X github.com/guttenbergovitz/vigil-cli/internal/version.Version={{.VERSION}} -X github.com/guttenbergovitz/vigil-cli/internal/version.Commit={{.COMMIT}} -X github.com/guttenbergovitz/vigil-cli/internal/version.Date={{.DATE}}"
  BINARY: vigil

tasks:
  default:
    desc: Build binary for host architecture
    cmds:
      - task: build

  build:
    desc: Build binary with version injection
    cmds:
      - go build {{.LDFLAGS}} -o {{.BINARY}} ./cmd/vigil
    sources:
      - cmd/**/*.go
      - internal/**/*.go
    generates:
      - "{{.BINARY}}"

  install:
    desc: Install to $GOPATH/bin with version injection
    cmds:
      - go install {{.LDFLAGS}} ./cmd/vigil

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}
      - rm -f coverage.out

  coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  version:
    desc: Show version information
    cmds:
      - echo "Version{{":"}} {{.VERSION}}"
      - echo "Commit{{":"}}  {{.COMMIT}}"
      - echo "Date{{":"}}    {{.DATE}}"

  tag:
    desc: Create a new git tag (usage{{":"}} task tag -- v1.0.0)
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task tag -- v1.0.0"
          exit 1
        fi
        git tag -a {{.CLI_ARGS}} -m "Release {{.CLI_ARGS}}"
        echo "Created tag {{.CLI_ARGS}}"
        echo "Push with: git push origin {{.CLI_ARGS}}"

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  lint:
    desc: Run linter
    cmds:
      - go vet ./...

  dev:
    desc: Build and run for quick testing
    cmds:
      - task: build
      - ./{{.BINARY}} version

  docker-build:
    desc: Build Docker image
    cmds:
      - |
        docker build \
          --build-arg VERSION={{.VERSION}} \
          --build-arg COMMIT={{.COMMIT}} \
          --build-arg DATE={{.DATE}} \
          -t vigil:{{.VERSION}} \
          -t vigil:latest \
          .

  docker-run:
    desc: Run Docker container
    cmds:
      - docker run --rm vigil:latest version

  docker-scan:
    desc: Run scan in Docker (mount current dir)
    cmds:
      - |
        docker run --rm \
          -v "$(pwd):/scan" \
          -e NVD_API_KEY="${NVD_API_KEY}" \
          -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
          vigil:latest scan .

  docker-push:
    desc: Push to DockerHub (requires login)
    cmds:
      - docker tag vigil:{{.VERSION}} guttenbergovitz/vigil:{{.VERSION}}
      - docker tag vigil:latest guttenbergovitz/vigil:latest
      - docker push guttenbergovitz/vigil:{{.VERSION}}
      - docker push guttenbergovitz/vigil:latest

  docker-readme:
    desc: Update DockerHub repository description/overview page
    cmds:
      - echo "DockerHub Overview Markdown generated at documentation/DOCKERHUB.md"

  docker-clean:
    desc: Remove local Docker image tags
    cmds:
      - docker rmi vigil:{{.VERSION}} vigil:latest 2>/dev/null || true

  nix-build:
    desc: Build binary using Nix Flake
    cmds:
      - nix build --extra-experimental-features 'nix-command flakes' .

  nix-run:
    desc: Run version command using Nix Flake
    cmds:
      - nix run --extra-experimental-features 'nix-command flakes' . -- version

  nix-scan:
    desc: Run scan using Nix Flake (scan current directory)
    cmds:
      - |
        nix run --extra-experimental-features 'nix-command flakes' . -- scan .

  nix-shell:
    desc: Enter Nix development environment
    cmds:
      - nix develop --extra-experimental-features 'nix-command flakes'

  nix-check:
    desc: Check Nix Flake output and syntax
    cmds:
      - nix flake check --extra-experimental-features 'nix-command flakes'

